<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Vulnerability Scanner</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 30px 15px; }
    .container { max-width: 720px; margin: 0 auto; background: #1e293b; padding: 28px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; }
    p.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
    .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
    button { padding: 12px 22px; border-radius: 8px; border: none; background: #2563eb; color: white; font-weight: 600; cursor: pointer; font-size: 1rem; }
    button:hover { background: #1d4ed8; }
    .results { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 18px; min-height: 180px; font-family: monospace; white-space: pre-wrap; line-height: 1.6; }
    .high { color: #f87171; font-weight: bold; }
    .med { color: #fbbf24; font-weight: bold; }
    .low { color: #60a5fa; font-weight: bold; }
    .pass { color: #4ade80; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Web Configuration Vulnerability Scanner</h1>
    <p class="sub">Passive audit for HTTPS enforcement, security headers, and server exposure.</p>
    <div class="input-row">
      <input type="text" id="urlInput" value="example.com" placeholder="Enter target domain (e.g. example.com)" />
      <button onclick="runAudit()">Start Scan</button>
    </div>
    <div class="results" id="output">Ready. Enter a domain and click Start Scan.</div>
  </div>

  <script>
    const SEC_HEADERS = [
      "strict-transport-security",
      "x-frame-options",
      "x-content-type-options",
      "content-security-policy",
      "referrer-policy"
    ];

    async function runAudit() {
      const out = document.getElementById("output");
      let target = document.getElementById("urlInput").value.trim();
      if (!target) return;
      if (!target.startsWith("http://") && !target.startsWith("https://")) {
        target = "https://" + target;
      }

      out.innerHTML = `Scanning ${target} ...\n\n`;

      try {
        // Uses public CORS proxy to inspect real HTTP response headers safely
        const proxyUrl = `https://allorigins.win{encodeURIComponent(target)}`;
        const res = await fetch(proxyUrl);
        let findings = [];

        if (!target.startsWith("https://")) {
          findings.push(`<span class="high">[HIGH]</span> Unencrypted HTTP protocol specified`);
        } else {
          findings.push(`<span class="pass">[PASS]</span> HTTPS connection verified`);
        }

        SEC_HEADERS.forEach(h => {
          if (!res.headers.get(h)) {
            findings.push(`<span class="med">[MEDIUM]</span> Missing security header: ${h}`);
          } else {
            findings.push(`<span class="pass">[PASS]</span> Header present: ${h}`);
          }
        });

        const server = res.headers.get("server");
        if (server) {
          findings.push(`<span class="low">[LOW]</span> Exposed Server banner: ${server}`);
        }

        out.innerHTML = `Scan Complete for ${target}\n${"-".repeat(45)}\n` + findings.join("\n");
      } catch (err) {
        out.innerHTML = `<span class="high">[ERROR]</span> Could not reach ${target} (${err.message})`;
      }
    }
  </script>
</body>
</html>
